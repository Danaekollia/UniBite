<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniBite – Admin Dashboard</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .leaderboard-entry { display: flex; align-items: center; gap: 1rem; padding: .8rem 0; border-bottom: 1px solid var(--gray-100); }
    .leaderboard-entry:last-child { border-bottom: none; }
    .rank { font-size: 1.4rem; font-weight: 700; width: 36px; text-align: center; flex-shrink: 0; }
    .rank-1 { color: #f9a825; }
    .rank-2 { color: var(--gray-600); }
    .rank-3 { color: #8d6e63; }
    .entry-info { flex: 1; }
    .entry-name { font-weight: 600; }
    .entry-sub { font-size: .85rem; color: var(--gray-600); }
    .entry-score { font-weight: 700; color: var(--green); font-size: 1.1rem; }

    /* clickable stat cards */
    .stat-card { cursor: pointer; transition: transform .15s, box-shadow .15s; }
    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
    .stat-card:hover .stat-label { color: var(--primary); }

    /* modal */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
    .modal-backdrop.open { display: flex; }
    .modal { background: #fff; border-radius: var(--radius); box-shadow: 0 16px 48px rgba(0,0,0,.22); width: 100%; max-width: 760px; max-height: 82vh; display: flex; flex-direction: column; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--gray-100); }
    .modal-title { font-weight: 700; font-size: 1.05rem; }
    .modal-close { background: none; border: none; cursor: pointer; color: var(--gray-600); font-size: 1.4rem; line-height: 1; padding: .2rem .5rem; border-radius: 4px; }
    .modal-close:hover { background: var(--gray-100); }
    .modal-body { overflow-y: auto; padding: 1.25rem 1.5rem; }
    .detail-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    .detail-table th { text-align: left; padding: .6rem .75rem; background: var(--gray-50); color: var(--gray-600); font-weight: 600; border-bottom: 2px solid var(--gray-100); }
    .detail-table td { padding: .6rem .75rem; border-bottom: 1px solid var(--gray-100); }
    .detail-table tr:last-child td { border-bottom: none; }
    .detail-table tr:hover td { background: var(--gray-50); }
  </style>
</head>
<body class="page-admin">
  <div class="site-header">
    <div class="container">
      <div class="site-header-topbar">
        <div class="site-header-brand">
          <svg class="ico ico-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="50" cy="42" r="30"/><ellipse cx="38" cy="31" rx="4" ry="5" fill="currentColor" stroke="none"/><ellipse cx="62" cy="31" rx="4" ry="5" fill="currentColor" stroke="none"/><path d="M34 49 Q50 63 66 49"/><line x1="6" y1="25" x2="6" y2="46"/><line x1="13" y1="22" x2="13" y2="46"/><line x1="20" y1="25" x2="20" y2="46"/><line x1="6" y1="46" x2="20" y2="46"/><line x1="13" y1="46" x2="11" y2="88"/><ellipse cx="87" cy="38" rx="8" ry="13"/><line x1="87" y1="51" x2="89" y2="88"/></svg>
          UniBite
        </div>
        <ul class="site-header-nav">
          <li><a href="#" id="logout-btn">Έξοδος</a></li>
        </ul>
      </div>
      <div class="site-header-content">
        <h1 id="user-greeting">Γεια σου!</h1>
      </div>
    </div>
  </div>

  <!-- Detail modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title"></span>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"><div class="spinner"></div></div>
    </div>
  </div>

  <div class="container" style="padding-top:1rem;padding-bottom:3rem;">
    <div id="alert-box"></div>

    <!-- Stats -->
    <h2 class="mb-2" style="font-size:1.1rem;font-weight:700;">Στατιστικά Τελευταίου Μήνα</h2>
    <div class="grid grid-3 mb-3" id="stats-grid">
      <div class="spinner"></div>
    </div>

    <!-- Leaderboard -->
    <div class="grid grid-2 gap-md" style="margin-top:2rem;">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title mb-2"><svg class="ico ico-lg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg> Top Donors</h3>
          <div id="top-donors"><div class="spinner"></div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <h3 class="card-title mb-2"><svg class="ico ico-lg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Highest Rated Γεύματα</h3>
          <div id="top-rated"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    (async () => {
      const user = await getUser();
      if (!user) { location.href = '/'; return; }
      if (user.role !== 'admin') { redirectByRole(user.role); return; }
      document.getElementById('user-greeting').textContent = 'Γεια σου, ' + user.username + '!';
      loadNotifications();
      await Promise.all([loadStats(), loadLeaderboard()]);
    })();

    document.getElementById('logout-btn').addEventListener('click', async (e) => {
      e.preventDefault();
      await API.post('/api/auth/logout');
      location.href = '/';
    });

    /* ── modal helpers ── */
    const backdrop = document.getElementById('modal-backdrop');
    const modalTitle = document.getElementById('modal-title');
    const modalBody  = document.getElementById('modal-body');

    document.getElementById('modal-close').addEventListener('click', closeModal);
    backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });

    function openModal(title) {
      modalTitle.textContent = title;
      modalBody.innerHTML = '<div class="spinner"></div>';
      backdrop.classList.add('open');
    }
    function closeModal() { backdrop.classList.remove('open'); }

    /* ── stats cards ── */
    async function loadStats() {
      const grid = document.getElementById('stats-grid');
      try {
        const stats = await API.get('/api/admin/stats');
        grid.innerHTML = `
          <div class="stat-card" data-detail="portions" title="Κλικ για αναλυτικά">
            <div class="stat-number">${stats.portions_shared_last_month}</div>
            <div class="stat-label">Μερίδες τελευταίου μήνα</div>
          </div>
          <div class="stat-card" data-detail="users" title="Κλικ για αναλυτικά">
            <div class="stat-number">${stats.total_users}</div>
            <div class="stat-label">Εγγεγραμμένοι φοιτητές</div>
          </div>
          <div class="stat-card" data-detail="listings" title="Κλικ για αναλυτικά">
            <div class="stat-number">${stats.total_listings}</div>
            <div class="stat-label">Συνολικές αγγελίες</div>
          </div>`;

        grid.querySelectorAll('.stat-card').forEach(card => {
          card.addEventListener('click', () => openDetail(card.dataset.detail));
        });
      } catch (err) {
        grid.innerHTML = '';
        showAlert(document.getElementById('alert-box'), err.message);
      }
    }

    /* ── detail loaders ── */
    async function openDetail(type) {
      const titles = { portions: 'Μερίδες τελευταίου μήνα', users: 'Εγγεγραμμένοι φοιτητές', listings: 'Συνολικές αγγελίες' };
      openModal(titles[type]);
      try {
        const data = await API.get('/api/admin/' + type + '-detail');
        if (type === 'portions')  renderPortionsDetail(data);
        if (type === 'users')     renderUsersDetail(data);
        if (type === 'listings')  renderListingsDetail(data);
      } catch (err) {
        modalBody.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    function renderPortionsDetail(rows) {
      if (!rows.length) { modalBody.innerHTML = '<p class="text-muted">Δεν υπάρχουν δεδομένα.</p>'; return; }
      modalBody.innerHTML = `
        <table class="detail-table">
          <thead><tr><th>#</th><th>Φοιτητής</th><th>Αγγελία</th><th>Μάγειρας</th><th>Ημερομηνία</th></tr></thead>
          <tbody>${rows.map((r, i) => `
            <tr>
              <td>${i + 1}</td>
              <td>${r.consumer_name}</td>
              <td>${r.listing_title}</td>
              <td>${r.cook_name}</td>
              <td>${formatDate(r.created_at)}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
    }

    function renderUsersDetail(rows) {
      if (!rows.length) { modalBody.innerHTML = '<p class="text-muted">Δεν υπάρχουν χρήστες.</p>'; return; }
      modalBody.innerHTML = `
        <table class="detail-table">
          <thead><tr><th>#</th><th>Username</th><th>Email</th><th>Ρόλος</th><th>Πόντοι</th><th>Εγγραφή</th></tr></thead>
          <tbody>${rows.map((u, i) => `
            <tr>
              <td>${i + 1}</td>
              <td><strong>${u.username}</strong></td>
              <td>${u.email}</td>
              <td><span class="badge badge-${u.role === 'cook' ? 'active' : 'pending'}">${u.role === 'cook' ? 'Μάγειρας' : 'Καταναλωτής'}</span></td>
              <td>${u.credits}</td>
              <td>${formatDate(u.created_at)}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
    }

    function renderListingsDetail(rows) {
      if (!rows.length) { modalBody.innerHTML = '<p class="text-muted">Δεν υπάρχουν αγγελίες.</p>'; return; }
      modalBody.innerHTML = `
        <table class="detail-table">
          <thead><tr><th>#</th><th>Τίτλος</th><th>Μάγειρας</th><th>Κατάσταση</th><th>Μερίδες</th><th>Ημερομηνία</th></tr></thead>
          <tbody>${rows.map((l, i) => `
            <tr>
              <td>${i + 1}</td>
              <td><a href="/listing.html?id=${l.id}" target="_blank">${l.title}</a></td>
              <td>${l.cook_name}</td>
              <td><span class="badge badge-${l.status}">${statusLabel(l.status)}</span></td>
              <td>${l.available_portions}/${l.total_portions}</td>
              <td>${formatDate(l.created_at)}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
    }

    async function loadLeaderboard() {
      try {
        const data = await API.get('/api/admin/leaderboard');
        renderDonors(data.top_donors);
        renderRated(data.top_rated);
      } catch (err) {
        showAlert(document.getElementById('alert-box'), err.message);
      }
    }

    function renderDonors(donors) {
      const container = document.getElementById('top-donors');
      if (!donors || donors.length === 0) {
        container.innerHTML = `<div class="empty-state">${ICO.awardXl}<p>Δεν υπάρχουν δεδομένα ακόμα</p></div>`;
        return;
      }
      container.innerHTML = donors.map((d, i) => `
        <div class="leaderboard-entry">
          <div class="rank rank-${i+1}">${i + 1}</div>
          <div class="entry-info">
            <div class="entry-name">${d.username}</div>
            <div class="entry-sub">Μερίδες</div>
          </div>
          <div class="entry-score">${d.portions_given}</div>
        </div>`).join('');
    }

    function renderRated(rated) {
      const container = document.getElementById('top-rated');
      if (!rated || rated.length === 0) {
        container.innerHTML = `<div class="empty-state">${ICO.starXl}<p>Δεν υπάρχουν αξιολογήσεις ακόμα</p></div>`;
        return;
      }
      container.innerHTML = rated.map((r, i) => `
        <div class="leaderboard-entry">
          <div class="rank rank-${i+1}">${i + 1}</div>
          <div class="entry-info">
            <div class="entry-name">${r.title}</div>
            <div class="entry-sub">${ICO.user} ${r.cook_name} · ${r.rating_count} αξιολογήσεις</div>
          </div>
          <div class="entry-score">${ICO.star} ${parseFloat(r.avg_score).toFixed(1)}</div>
        </div>`).join('');
    }
  </script>
</body>
</html>
